---
fluid:
  Weather:
    Long_Name: Weather
    Instance: weather
    Route: weather/
    Model: GEOSFP
    Title: 'GEOS-FP: Weather Analyses and Forecasts'
    Data_Access:
      https_assim:
        Long_Name: HTTPS/Assimilation
        Route: https://portal.nccs.nasa.gov/datashare/gmao/geos-fp/das/
      https_fcst:
        Long_Name: HTTPS/Forecast
        Route: https://portal.nccs.nasa.gov/datashare/gmao/geos-fp/forecast/
      opendap_assim:
        Long_Name: OPeNDAP/Assimilation
        Route: http://opendap.nccs.nasa.gov/dods/GEOS-5/fp/0.25_deg/assim
      opendap_fcst:
        Long_Name: OPeNDAP/Forecast
        Route: http://opendap.nccs.nasa.gov/dods/GEOS-5/fp/0.25_deg/fcast
      tool_assim:
        Long_Name: Data Download Tool/Assimilation
        Route: https://fluid.nccs.nasa.gov/dload_landing/?dataset=assim
      tool_fsct:
        Long_Name: Data Download Tool/Forecast
        Route: https://fluid.nccs.nasa.gov/dload_landing/?dataset=fcast
    Theme_defaults: &default_wxmaps
      url_for: wxmaps.api
      Option_key: theme
      Hold_Region: True
    Themes:
      grams:
        <<: *default_wxmaps
        Long_Name: Datagrams
        url_for: gram.api
        Option_key: product
        Option_value: meteo
        Route: grams/
      wxmaps:
        <<: *default_wxmaps
        Long_Name: WxMaps
        Option_value: 
      chem2d:
        <<: *default_wxmaps
        Long_Name: Chem Maps
        Option_value: chem2d
      chem3d:
        <<: *default_wxmaps
        Long_Name: 3D Chem Maps
        Option_value: chem3d
      obstat_coverage:
        Long_Name: Observing System Statistics
        Short_Name: Obs Sys Stats
        Route: https://gmao.gsfc.nasa.gov/forecasts/systems/fp/obstat_coverage/
      radmon_diagnostics.php:
        Long_Name: Radiance Monitoring
        Short_Name: Radiance
        Route: https://gmao.gsfc.nasa.gov/forecasts/radmon_diagnostics.php
      obs_impact:
        Long_Name: Observation Impacts
        Short_Name: Obs Impacts
        Route: https://gmao.gsfc.nasa.gov/forecasts/systems/fp/obs_impact/
  Reanalysis:
    Long_Name: Reanalysis
    Instance: reanalysis
    Route: reanalysis/
    Model: MERRA-2
    Title: GMAO Reanalysis Products
    Data_Access:
      data_access:
        Long_Name: GMAO Data Access Page
        Route: reanalysis/MERRA-2/data_access/
    Theme_defaults: &default_reanalysis
      url_for: reanalysis.api
      Option_key: theme
      Hold_Region: True      
    Themes:
      classic_merra2:
        <<: *default_reanalysis
        Long_Name: WxMaps
        Option_value: classic_merra2
      chem2d_merra2:
        <<: *default_reanalysis
        Long_Name: Chem Maps
        Option_value: chem2d_merra2
      anomaly_merra2:
        <<: *default_reanalysis
        Long_Name: Climatology & Anomalies
        Option_value: anomaly_merra2
        Info_Route: reanalysis/technical/
      extreme_merra2:
        <<: *default_reanalysis
        Long_Name: Climate Statistic
        Option_value: extreme_merra2
        Info_Route: reanalysis/climate_technical/
  CF:
    Long_Name: Composition Forecast
    Instance: cf
    Route: cf/
    Model: GEOS-CF
    Title: 'GEOS-CF: Composition Forecasts'
    Links:
      cf_map:
        Long_Name: Interactive CF Map Tool
        Route: cf_map/index
      questions:
        Long_Name: Find more information on CF forecasts and replay here.
        Route: https://gmao.gsfc.nasa.gov/weather_prediction/GEOS-CF/docs/
      contact:
        Long_Name: Contact us at geos-cf@lists.nasa.gov
        Route: mailto:geos-cf@lists.nasa.gov
    Data_Access:
      https_assim:
        Long_Name: HTTPS/Assimilation
        Route: https://portal.nccs.nasa.gov/datashare/gmao/geos-fp/das/
      https_fcst:
        Long_Name: HTTPS/Forecast
        Route: https://portal.nccs.nasa.gov/datashare/gmao/geos-fp/forecast/
      opendap_assim:
        Long_Name: OPeNDAP/Assimilation
        Route: http://opendap.nccs.nasa.gov/dods/GEOS-5/fp/0.25_deg/assim
      opendap_fcst:
        Long_Name: OPeNDAP/Forecast
        Route: http://opendap.nccs.nasa.gov/dods/GEOS-5/fp/0.25_deg/fcast
      tool_assim:
        Long_Name: Data Download Tool/Assimilation
        Route: https://fluid.nccs.nasa.gov/dload_landing/?dataset=assim
      tool_fsct:
        Long_Name: Data Download Tool/Forecast
        Route: https://fluid.nccs.nasa.gov/dload_landing/?dataset=fcast
    Theme_defaults: &default_cf
      url_for: cf.api
      Option_key: theme
      Hold_Region: True
    Themes:
      grams:
        <<: *default_cf
        Long_Name: Datagrams
        Option_key: gram.api
        Option_value: cf_no2
        Route: grams/cf_no2/
      classic_geos_cf:
        <<: *default_cf
        Long_Name: Surface Concentrations
        Option_value: classic_geos_cf
      totcol_geos_cf:
        <<: *default_cf
        Long_Name: Total Column
        Option_value: totcol_geos_cf
  Carbon:
    Long_Name: Carbon
    Instance: carbon
    Route: carbon/
    Model: GEOSCC
    Title: GMAO Carbon Reanalysis
    Theme_defaults: &default_carbon
      url_for: carbon.api
      Option_key: theme
      Hold_Region: True
    Themes:
      custom_carbon:
        <<: *default_carbon
        Long_Name: Spatial Maps
        url_for: carbon.api
        Option_value: custom_carbon
      grams:
        <<: *default_carbon
        Long_Name: Datagrams
        url_for: grams.api
        Option_key: product
        Option_value: carbon_co2
        Route: grams/carbon_co2/
  S2S:
    Long_Name: S2S
    Instance: s2s
    Route: s2s/
    Theme_defaults: &default_s2s
      url_for: s2s.api
      Option_key: theme
      Hold_Region: True
    Themes:
      classic_s2s_seasonal:
        <<: *default_s2s
        Long_Name: S2S Forecast
        url_for: s2s.api
        Option_key: classic_s2s_seasonal
